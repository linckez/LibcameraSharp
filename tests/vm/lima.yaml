# Lima VM for functional tests: Debian trixie, the release Raspberry Pi OS is built on, so the
# libraries here (glibc, FFmpeg) are the ones a Pi runs. libcamera's `virtual` camera allocates its
# buffers from udmabuf, which Docker Desktop's kernel lacks, so this needs a real Linux kernel.
#
# From the repository's root, which the VM mounts at /work:
#
#   limactl create --name libcamera \
#     --set ".mounts = [{\"location\": \"$PWD\", \"mountPoint\": \"/work\", \"writable\": true}]" tests/vm/lima.yaml
#   limactl shell libcamera -- /work/tests/vm/setup-libcamera.sh
#
# Debian's "generic" image, not "genericcloud": the cloud kernel is built without media or udmabuf.
# Debian's kernel has no vimc either, so the tests use the userspace `virtual` camera.
images:
  - location: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-generic-arm64.qcow2"
    arch: "aarch64"
vmType: vz

cpus: 4
memory: 6GiB
disk: 40GiB

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      # let the default user reach the video and dma-buf devices without sudo
      cat > /etc/udev/rules.d/99-libcamera-test.rules <<'RULES'
      KERNEL=="video[0-9]*", GROUP="video", MODE="0660"
      KERNEL=="media[0-9]*", GROUP="video", MODE="0660"
      KERNEL=="udmabuf", GROUP="video", MODE="0660"
      SUBSYSTEM=="dma_heap", GROUP="video", MODE="0660"
      SUBSYSTEM=="dma_heap", KERNEL=="system", SYMLINK+="dma_heap/linux,cma"
      RULES
      udevadm control --reload && udevadm trigger
      # libcamera build deps (+ cam app deps), shim build deps, generator deps, FFmpeg for the libav package, libexif for the EXIF shim
      apt-get install -y --no-install-recommends \
        build-essential git ninja-build meson pkg-config cmake clang \
        python3 python3-yaml python3-jinja2 python3-ply python3-clang \
        libyaml-dev libgnutls28-dev libudev-dev libevent-dev libdrm-dev libyuv-dev \
        libjpeg-dev libtiff-dev libpng-dev \
        libcap-dev \
        v4l-utils curl ca-certificates unzip libicu76 \
        libavcodec-dev libavformat-dev libswscale-dev libavutil-dev ffmpeg libexif-dev
  - mode: user
    script: |
      #!/bin/bash
      set -eux
      sudo usermod -aG video "$USER" || true
      # .NET 10 SDK (not in Debian's apt; use Microsoft's installer)
      if [ ! -x "$HOME/.dotnet/dotnet" ]; then
        curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
        bash /tmp/dotnet-install.sh --channel 10.0 --install-dir "$HOME/.dotnet"
      fi
      # /etc/profile.d so non-interactive `limactl shell -- bash -lc` sees it (~/.bashrc exits early)
      sudo tee /etc/profile.d/libcamera-dev.sh >/dev/null <<'RC'
      export DOTNET_ROOT="$HOME/.dotnet"
      export PATH="$HOME/.dotnet:$PATH"
      export DOTNET_CLI_TELEMETRY_OPTOUT=1
      RC

probes:
  - description: "udmabuf present, for the virtual camera's buffers"
    script: |
      #!/bin/bash
      set -eux
      timeout 60s bash -c 'until ls /dev/udmabuf >/dev/null 2>&1; do sleep 2; done'
    hint: "no /dev/udmabuf; check the VM runs Debian's generic kernel (uname -r), not the cloud one."
